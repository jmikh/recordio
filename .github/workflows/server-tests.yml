name: server-tests

# Railway is configured to "Wait for CI" — its deploy of server/ is blocked
# until this check is green on the commit.
#
# The e2e tier runs against a real local Postgres (`supabase start`), so the
# job spins up the local stack and runs tests via the ROOT vitest config,
# which loads the committed .env.test (well-known local-stack values — no
# GitHub secrets). The third-party adapter integration tier (real S3 creds
# etc.) auto-skips here — it stays out of the blocking job by design.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Start supabase in the background so image pulls overlap with npm ci.
      # Tests only need db, auth (gotrue), rest (postgrest), storage-api and
      # kong — everything else is excluded to skip its image pull entirely.
      - name: Start supabase (background)
        run: |
          (supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; echo $? > /tmp/supabase-start.exit) > /tmp/supabase-start.log 2>&1 &
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - name: Wait for supabase start
        run: |
          timeout 300 bash -c 'until [ -f /tmp/supabase-start.exit ]; do sleep 2; done'
          cat /tmp/supabase-start.log
          exit "$(cat /tmp/supabase-start.exit)"
      # migrations/ can carry stale snapshots of sql/-managed functions
      # (e.g. render_job_get_or_create) — deploy sql/ so the merge-blocking
      # tier tests the SQL production actually runs
      - name: Deploy SQL functions/crons/triggers
        run: supabase/sql/deploy.sh
      - run: npx vitest run server webapp/src/api
