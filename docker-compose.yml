version: '3.8'

services:
  minio:
    image: minio/minio
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
