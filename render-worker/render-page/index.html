<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recordio Render</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 24px;
        }
        #status { font-size: 18px; margin-bottom: 12px; }
        #progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        #progress-fill {
            height: 100%;
            background: #4f9cf7;
            width: 0%;
            transition: width 0.2s;
        }
        #log {
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            background: #111;
            padding: 12px;
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>
    <div id="status">Waiting for render job...</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="log"></div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
