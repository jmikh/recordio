# fly.toml app configuration file generated for recordio-render-worker on 2026-04-27T21:07:53-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'recordio-render-worker'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'
  docker_context = '..'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 4
    soft_limit = 2

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'performance-12x'
  cpus = 12
  memory_mb = 24576
