app = "recordio-render-worker"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 4
    soft_limit = 2

# Render requests can take several minutes
[http_service.machine_checks]

[[vm]]
  size = "performance-2x"
  memory = "4gb"
